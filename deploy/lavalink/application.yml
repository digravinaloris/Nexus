# Nexus Lavalink configuration
# Multi-source playback: YouTube, SoundCloud and Bandcamp.

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Try clients in order; YouTube may change or restrict individual clients.
    clients:
      - ANDROID_VR
      - WEB
      - MWEB
      - WEBEMBEDDED

  lavasrc:
    providers:
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
      - "bcsearch:%QUERY%"
    sources:
      spotify: false
      applemusic: false
      deezer: false
      yandexmusic: false
      youtube: false
      vkmusic: false
      tidal: false
      qobuz: false
      jiosaavn: false
      ytdlp: false
    lyrics-sources:
      spotify: false
      deezer: false
      youtube: false
      yandexmusic: false
      vkmusic: false
      lrcLib: true

server:
  address: 0.0.0.0
  port: "${PORT:2333}"

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    - dependency: "com.github.topi314.lavasearch:lavasearch-plugin:1.0.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      # The legacy built-in source must stay disabled; youtube-source replaces it.
      youtube: false
      soundcloud: true
      bandcamp: true
      http: false
      local: false
      twitch: false
      vimeo: false
      nico: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    playerUpdateInterval: 5
    youtubeSearchEnabled: false
    soundcloudSearchEnabled: true
    gc-warnings: true
