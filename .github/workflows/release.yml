name: Release

# Se déclenche uniquement sur un tag de version (ex: v1.4.0), jamais sur un
# simple push vers main -- évite tout risque de boucle (pas de commit auto
# vers main, juste la création d'une Release GitHub).
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release with auto-generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
