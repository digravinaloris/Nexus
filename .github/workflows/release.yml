name: Release

# Publish only the release notes explicitly supplied in the annotated tag.
# GitHub's automatic "What's Changed" / contributor changelog is disabled.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare concise release notes
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          ANNOTATION=""
          if [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ]; then
            ANNOTATION="$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG")"
          fi

          if [ -z "$ANNOTATION" ]; then
            ANNOTATION="## Nexus $TAG

          See the repository documentation for feature details."
          fi

          printf '%s\n' "$ANNOTATION" > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: false
