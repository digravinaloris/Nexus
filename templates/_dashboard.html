{% extends "_layout.html" %}
{% block content %}
<div class="topbar">
  <div class="brand"><span class="dot"></span> Nexus</div>
  <div class="user-chip">
    <div class="lang-switch">
      <form method="post" action="{{ url_for('dash_set_lang', lang_code='en', next=request.path) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit" class="{{ 'active' if session.get('lang', 'en')=='en' else '' }}">EN</button></form>
      <form method="post" action="{{ url_for('dash_set_lang', lang_code='fr', next=request.path) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit" class="{{ 'active' if session.get('lang', 'en')=='fr' else '' }}">FR</button></form>
    </div>
    <div class="lang-switch">
      <form method="post" action="{{ url_for('dash_set_theme', theme_name='dark', next=request.path) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit" class="{{ 'active' if session.get('theme', 'dark')=='dark' else '' }}">🌙</button></form>
      <form method="post" action="{{ url_for('dash_set_theme', theme_name='light', next=request.path) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit" class="{{ 'active' if session.get('theme', 'dark')=='light' else '' }}">☀️</button></form>
    </div>
    {% if user and user.avatar %}
      <img src="https://cdn.discordapp.com/avatars/{{ user.id }}/{{ user.avatar }}.png" alt="">
    {% endif %}
    {{ user.global_name or user.username }}
    <form class="logout-form" method="post" action="{{ url_for('dash_logout') }}">
      <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}">
      <button class="logout" type="submit">{{ t('logout') }}</button>
    </form>
  </div>
</div>
{% block page %}{% endblock %}
{% endblock %}
